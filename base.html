<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moxy</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <!-- Top navigation: brand, settings menu, and page links -->
  <nav>
    <!-- Brand and settings menu -->
    <div class="brand-area">
      <a class="brand" href="#">Moxy</a>
      <details class="settings-details">
        <summary class="settings-button" aria-label="Settings" title="Settings">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"></path>
          </svg>
        </summary>
        <div class="settings-menu" id="settings-menu" aria-label="Settings options">
          <!-- Placeholder for a future integration setting -->
          <span class="settings-option" aria-disabled="true" title="Integration is not connected">
            <span>Integrate</span>
          </span>
          <!-- Theme picker -->
          <details class="themes-details">
            <summary class="settings-option">
              <span>Themes</span>
              <span class="submenu-arrow" aria-hidden="true">›</span>
            </summary>
            <div class="theme-options" id="theme-options">
              <input class="theme-radio" type="radio" name="theme" id="theme-dark" value="dark">
              <label class="theme-option" for="theme-dark">
                <span class="theme-swatch dark-swatch"></span><span>Dark mode</span>
              </label>
              <input class="theme-radio" type="radio" name="theme" id="theme-platinum" value="platinum" checked>
              <label class="theme-option" for="theme-platinum">
                <span class="theme-swatch platinum-swatch"></span><span>Platinum</span>
              </label>
              <input class="theme-radio" type="radio" name="theme" id="theme-strawberry" value="strawberry">
              <label class="theme-option" for="theme-strawberry">
                <span class="theme-swatch strawberry-swatch"></span><span>Strawberry</span>
              </label>
            </div>
          </details>
          <span class="menu-divider" aria-hidden="true"></span>
          <!-- Sign out returns to the standalone sign-in page -->
          <a class="settings-option signout-option" href="signin.html">
            <span>Sign out</span>
          </a>
        </div>
      </details>
    </div>
    <!-- Main navigation links -->
    <div class="links">
      <a class="about-link" href="#about">About</a>
      <a class="signin-link" href="signin.html">Sign in</a>
      <a class="signup-link" href="#signup">Sign up</a>
    </div>
  </nav>

  <!-- Main page content and chat composer -->
  <main>
    <h1>How can I help you today?</h1>

    <div class="chat-layout">
      <!-- Chat panel: conversation history, attachments, voice input, and message form -->
      <section class="chat" tabindex="0" aria-label="Chat with Moxy">
        <div class="messages">
          <div class="msg bot">Hi, I am Moxy. How can I help?</div>
        </div>

        <form class="composer" action="#" method="post" enctype="multipart/form-data">
          <input class="toggle" type="checkbox" id="plus-toggle" aria-label="Open add menu">
          <div class="menu">
            <label for="file-doc">Add document</label>
            <label for="file-photo">Add photo</label>
            <label for="file-video">Add video</label>
            <label for="file-audio">Add audio</label>
            <input type="file" id="file-doc" name="document" accept=".pdf,.doc,.docx,.txt">
            <input type="file" id="file-photo" name="photo" accept="image/*">
            <input type="file" id="file-video" name="video" accept="video/*">
            <input type="file" id="file-audio" name="audio" accept="audio/*">
          </div>
          <label class="plus" for="plus-toggle" title="Add">+</label>
          <button
            class="voice-button"
            type="button"
            aria-label="Start voice input"
            aria-pressed="false"
            title="Voice input"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path>
            </svg>
          </button>
          <input type="text" name="message" placeholder="Message Moxy" autocomplete="off">
          <button type="submit">Send</button>
        </form>
        <span class="sr-only" id="voice-status" aria-live="polite"></span>
      </section>
    </div>
  </main>

  <!-- About dialog; opened by the About navigation link -->
  <div class="modal" id="about">
    <a class="backdrop" href="#" aria-label="Close"></a>
    <div class="card">
      <a class="close" href="#" aria-label="Close">×</a>
      <h2>About Moxy</h2>
      <p>
        Moxy is a local AI assistant for your desktop. Chat with it, give it voice
        commands and add files to ask questions about them.
      </p>
    </div>
  </div>



  <!-- Sign-up dialog; opened by the Sign up navigation link -->
  <div class="modal" id="signup">
    <a class="backdrop" href="#" aria-label="Close"></a>
    <div class="card">
      <a class="close" href="#" aria-label="Close">×</a>
      <h2>Sign up</h2>
      <form action="#" method="post">
        <label>
          Name
          <input type="text" name="name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" minlength="8" required>
        </label>
        <button type="submit">Sign up</button>
      </form>
    </div>
  </div>

</body>
</html>
